# numenews — local infrastructure.
#
# Qdrant is the only required service: it holds the six collections (`news`,
# `numbers`, `patterns`, `forecasts`, `number_history`, `digests`), their payload indexes and
# the hybrid-search vectors. `make dev` brings it up and waits until it is healthy,
# `make clean` stops it and deletes the volume.
#
# Connection settings are read from `.env` (see `.env.example`); `Settings.qdrant_url`
# defaults to http://localhost:6333, which is what this file exposes.

name: numenews

services:
  # --- Qdrant -------------------------------------------------------------------
  # The dashboard is served from the same HTTP port: http://localhost:6333/dashboard.
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: numenews-qdrant
    ports:
      - "6333:6333" # HTTP API + dashboard
      - "6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The image ships bash but not curl, so readiness is probed with bash's
      # /dev/tcp pseudo-device against the HTTP port.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  qdrant_storage:
