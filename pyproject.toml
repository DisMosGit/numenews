[project]
name = "numenews"
version = "0.1.0"
description = "MCP server and one-shot CLI that extracts numbers, dates, and names from news, computes numerological resonances via hybrid search in Qdrant, and builds a daily numerological forecast with long-term number-activation memory."
readme = "README.md"
authors = [
    { name = "DisMosGit", email = "DisSurgu@ya.ru" }
]
requires-python = ">=3.14"

# Dependencies arrive with the phase that needs them, so every commit keeps the
# environment honest about what the code actually imports:
#
#   Installed  Phase 0: pydantic, pydantic-settings, structlog, qdrant-client
#              (qdrant-client was already needed by the `qdrant_in_memory` test
#              fixture from phase 0.8)
#              Phase 2: httpx, hishel[httpx] (RFC 9111 cache) and tenacity (retries);
#              respx, the httpx mock, is a dev dependency
#   Later      Phase 3 fastembed, Phase 4 pydantic-ai, Phase 6 mcp,
#              Phase 7 typer + rich, Phase 9 ragas — see the note below; it stays
#              out of the default sync
#
# `ragas` hard-depends on langchain, langchain-core, langchain-community and
# langchain_openai, and AGENTS.md rules LangChain out: the eval harness must not
# leak into the runtime environment. Phase 9 decides how to isolate it (the
# intended shape is an opt-in dependency group installed only by `make test-eval`).
dependencies = [
    "hishel[httpx]>=1.4",
    "httpx>=0.28.1",
    "pydantic>=2.11",
    "pydantic-settings>=2.15",
    "qdrant-client>=1.19",
    "structlog>=26.1",
    "tenacity>=9.1.4",
]

[project.urls]
Repository = "https://github.com/DisMosGit/numenews"

# Developer tools live in a dependency group rather than in `[project]`: they are
# never imported by the package itself, and `uv sync` installs the group by default.
[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "mypy>=2.3.1",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.8",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

# -----------------------------------------------------------------------------
# Ruff
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
# `select = all` was the roadmap's first sketch; this curated set is the one the
# project actually keeps green. ANN401 is ignored because `Any` is already banned
# by AGENTS.md, and re-checking it at third-party boundaries only adds noise.
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ANN", "RUF", "PTH"]
ignore = ["ANN401"]

# The gematria module and its tests name Cyrillic letters on purpose: the value tables are keyed by
# them and the worked examples read as words, so RUF001/002/003 would report the deliberate
# mixed-script fragments as accidental confusables. Everywhere else the rules stay on.
[tool.ruff.lint.per-file-ignores]
"src/numenews/numerology/gematria.py" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/test_gematria.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["numenews"]

# -----------------------------------------------------------------------------
# Mypy (strict)
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
# Pydantic models carry the domain's data; the plugin checks their generated
# `__init__` signatures instead of falling back to `**data: Any`.
plugins = ["pydantic.mypy"]
# The package lives in `src/`; without this mypy resolves `import numenews`
# through the editable install instead of the sources it is analysing.
mypy_path = ["src"]
exclude = ['^\.venv/', '^build/', '^dist/']

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

# -----------------------------------------------------------------------------
# pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
# pytest-asyncio >= 1.0 removed the `event_loop` fixture; the scope is configured
# here instead, which is also what keeps the deprecation warning away.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: needs a reachable service (Docker Qdrant; HTTP and LLM calls are mocked)",
    "eval: RAG quality metrics, run only with --run-eval (phase 9)",
]

# -----------------------------------------------------------------------------
# Coverage
# -----------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["numenews"]

[tool.coverage.report]
show_missing = true
# The per-layer floors (numerology 95%, agents/pipeline 80%, vector/news 70%) land
# with their layers and are enforced in phase 10; a non-zero floor would fail
# `make test` on the skeleton, which has nothing to cover yet.
fail_under = 0
