[project]
name = "numenews"
version = "0.1.0"
description = "MCP server and one-shot CLI that extracts numbers, dates, and names from news, computes numerological resonances via hybrid search in Qdrant, and builds a daily numerological forecast with long-term number-activation memory."
readme = "README.md"
authors = [
    { name = "DisMosGit", email = "DisSurgu@ya.ru" }
]
requires-python = ">=3.14"
dependencies = []

# The repository root is a workspace root, not an installable package:
# only the members under packages/, apps/ and tools/ are built and installed.
[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
