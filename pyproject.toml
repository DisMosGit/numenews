[project]
name = "numenews"
version = "0.1.0"
description = "MCP server and one-shot CLI that extracts numbers, dates, and names from news, computes numerological resonances via hybrid search in Qdrant, and builds a daily numerological forecast with long-term number-activation memory."
readme = "README.md"
authors = [
    { name = "DisMosGit", email = "DisSurgu@ya.ru" }
]
requires-python = ">=3.14"

# Dependencies arrive with the phase that needs them, so every commit keeps the
# environment honest about what the code actually imports:
#
#   Installed  Phase 0: pydantic, pydantic-settings, structlog, qdrant-client
#              (qdrant-client was already needed by the `qdrant_in_memory` test
#              fixture from phase 0.8)
#              Phase 2: httpx, hishel[httpx] (RFC 9111 cache) and tenacity (retries);
#              respx, the httpx mock, is a dev dependency
#              Phase 3: fastembed, the local ONNX embedder of `embeddings/`. It
#              brings onnxruntime, huggingface-hub, tokenizers, numpy, pillow,
#              tqdm, loguru, py-rust-stemmers, mmh3 and requests with it; the two
#              bge models are downloaded on first use, not at import (see
#              docs/EMBEDDINGS.md)
#              Phase 4: pydantic-ai-slim[openai], the agent runtime of `agents/`.
#              The `pydantic-ai` meta-package hard-pulls the anthropic, google,
#              logfire, evals, mcp and web extras, none of which the agents use;
#              slim + the openai extra is the whole surface they need
#              (see ADR 0004)
#              Phase 6: mcp, the official MCP Python SDK. It is v2, where the
#              server class is `MCPServer` (v1's `FastMCP` was renamed); the
#              stdio transport comes with it (see ADR 0010)
#              Phase 7: typer, the CLI framework of `cli/`. It brings rich,
#              shellingham and annotated-doc with it; rich paints the `--help`
#              output and is never imported by this package, so it is not
#              listed as a dependency of its own
#   Later      Phase 9 ragas — see the note
#              below; ragas stays out of the default sync
#
# `ragas` hard-depends on langchain, langchain-core, langchain-community and
# langchain_openai, and AGENTS.md rules LangChain out: the eval harness must not
# leak into the runtime environment. Phase 9 decides how to isolate it (the
# intended shape is an opt-in dependency group installed only by `make test-eval`).
dependencies = [
    "fastembed>=0.8",
    "hishel[httpx]>=1.4",
    "httpx>=0.28.1",
    "mcp>=2.2,<3",
    "pydantic>=2.11",
    "pydantic-ai-slim[openai]>=2.46",
    "pydantic-settings>=2.15",
    "qdrant-client>=1.19",
    "structlog>=26.1",
    "tenacity>=9.1.4",
    "typer>=0.27.2",
]

[project.urls]
Repository = "https://github.com/DisMosGit/numenews"

# `uv run numenews …` is the installed form of `python -m numenews.cli`; both go
# through the same Typer application (roadmap 7.1).
[project.scripts]
numenews = "numenews.cli.main:app"

# Developer tools live in a dependency group rather than in `[project]`: they are
# never imported by the package itself, and `uv sync` installs the group by default.
[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "mypy>=2.3.1",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.8",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

# -----------------------------------------------------------------------------
# Ruff
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
# `select = all` was the roadmap's first sketch; this curated set is the one the
# project actually keeps green. ANN401 is ignored because `Any` is already banned
# by AGENTS.md, and re-checking it at third-party boundaries only adds noise.
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ANN", "RUF", "PTH"]
ignore = ["ANN401"]

# The gematria module and its tests name Cyrillic letters on purpose: the value tables are keyed by
# them and the worked examples read as words, so RUF001/002/003 would report the deliberate
# mixed-script fragments as accidental confusables. The agent prompts and their tests are the same
# story from phase 4: they carry Russian few-shot examples next to English instructions, and the
# confusable pairs the rules flag are exactly the product's bilingual text. Everywhere else the
# rules stay on.
[tool.ruff.lint.per-file-ignores]
"src/numenews/numerology/gematria.py" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/test_gematria.py" = ["RUF001", "RUF002", "RUF003"]
"src/numenews/agents/prompts.py" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/test_agents_forecast.py" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/test_agents_pattern.py" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/test_agents_prompts.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["numenews"]

# -----------------------------------------------------------------------------
# Mypy (strict)
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
# Pydantic models carry the domain's data; the plugin checks their generated
# `__init__` signatures instead of falling back to `**data: Any`.
plugins = ["pydantic.mypy"]
# The package lives in `src/`; without this mypy resolves `import numenews`
# through the editable install instead of the sources it is analysing.
mypy_path = ["src"]
exclude = ['^\.venv/', '^build/', '^dist/']

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

# `ragas` is installed only in `.venv-eval` (ADR 0013) — it cannot share an environment with
# `pydantic-ai` — so the eval harness imports it where mypy, which runs in `.venv`, cannot see it.
# The boundary is `Any` on purpose: the harness's own code is typed, the ragas calls are not.
[[tool.mypy.overrides]]
module = ["ragas", "ragas.*"]
ignore_missing_imports = true

# -----------------------------------------------------------------------------
# pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
# pytest-asyncio >= 1.0 removed the `event_loop` fixture; the scope is configured
# here instead, which is also what keeps the deprecation warning away.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: needs a reachable service (Docker Qdrant; HTTP and LLM calls are mocked)",
    "eval: RAG quality metrics, run only with --run-eval (phase 9)",
]
filterwarnings = [
    # Two vector tests deliberately point the client at a dead port to exercise the health check;
    # the client's own compatibility probe then warns that it could not read the server version,
    # which is the outcome under test, not a problem to report.
    "ignore:Failed to obtain server version:UserWarning",
    # The in-memory engine is a real Qdrant that declares payload indexes it cannot use; every
    # collection creation of the in-memory tests warns once per index. The indexes themselves are
    # asserted against the Docker server in tests/integration/test_vector_docker.py.
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]

# -----------------------------------------------------------------------------
# Coverage
# -----------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["numenews"]

[tool.coverage.report]
show_missing = true
# The per-layer floors (numerology 95%, agents/pipeline 80%, vector/news 70%) land
# with their layers and are enforced in phase 10; a non-zero floor would fail
# `make test` on the skeleton, which has nothing to cover yet.
fail_under = 0
